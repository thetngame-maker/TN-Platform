name: Connect Four Develop

on:
  push:
    branches:
      - connect-four-develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4

      - name: Verify modular hosted controllers
        working-directory: services/connect-four-room-server
        run: |
          node --check server.js
          node --check account-signin-v2.1-launcher.js
          node --check multi-game-router-v2.4.js
          node --check games/registry.js
          node --check games/color-clash/controller.js
          node --check games/color-clash/engine.js
          grep -q 'PHONE CONTROLLER v2.1 ACCOUNT FOUNDATION' account-signin-v2.1-launcher.js
          grep -q 'PHONE CONTROLLER v3.1 FIRST PLAYABLE ROUND' games/color-clash/controller.js
          grep -q 'COLOR CLASH LIVE' games/color-clash/controller.js
          grep -q 'DRAW CARD' games/color-clash/controller.js
          grep -q 'controllerPath.*color-clash' games/color-clash/controller.js
          grep -q 'getGameByPath' games/registry.js
          grep -q 'node multi-game-router-v2.4.js' package.json

      - name: Smoke test modular hosted service
        working-directory: services/connect-four-room-server
        run: |
          npm start > /tmp/connect-four-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            BASE_PAGE=$(curl --fail --silent 'http://127.0.0.1:8070/' || true)
            COLOR_PAGE=$(curl --fail --silent 'http://127.0.0.1:8070/color-clash?room=TEST' || true)
            LEGACY_COLOR_PAGE=$(curl --fail --silent 'http://127.0.0.1:8070/?room=TEST&game=color-clash' || true)
            if echo "$BASE_PAGE" | grep -q 'PHONE CONTROLLER v2.1 ACCOUNT FOUNDATION' \
              && echo "$COLOR_PAGE" | grep -q 'PHONE CONTROLLER v3.1 FIRST PLAYABLE ROUND' \
              && echo "$COLOR_PAGE" | grep -q 'JOIN COLOR CLASH' \
              && echo "$COLOR_PAGE" | grep -q 'DRAW CARD' \
              && echo "$LEGACY_COLOR_PAGE" | grep -q 'PHONE CONTROLLER v3.1 FIRST PLAYABLE ROUND' \
              && ! echo "$COLOR_PAGE" | grep -q 'CONNECT FOUR'; then
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/connect-four-server.log
          exit 1

      - name: Build TN Game modular platform ZIP
        run: |
          chmod +x experiences/roku/connect-four/*.sh
          experiences/roku/connect-four/build-development.sh

      - name: Verify TN Game modular Roku package
        run: |
          ZIP='experiences/roku/connect-four/dist/tn-game-connect-four-dev.zip'
          test -f "$ZIP"
          unzip -Z1 "$ZIP" | grep -qx manifest
          unzip -Z1 "$ZIP" | grep -qx components/DisplayLoopTask.brs
          unzip -Z1 "$ZIP" | grep -qx components/GameRouter.brs
          unzip -p "$ZIP" components/MainScene.xml | grep -q 'pkg:/components/GameRouter.brs'
          unzip -p "$ZIP" components/MainScene.brs | grep -q 'v3.1 COLOR CLASH PLAYABLE'
          unzip -p "$ZIP" components/MainScene.brs | grep -q 'routeForSelection(m.lobbySelection)'
          unzip -p "$ZIP" components/MainScene.brs | grep -q 'controllerUrlForGame(m.baseUrl, m.activeRoute, m.roomCode)'
          unzip -p "$ZIP" components/MainScene.brs | grep -q 'applyColorClashTvState'
          unzip -p "$ZIP" components/MainScene.brs | grep -q 'game=color-clash'
          unzip -p "$ZIP" components/GameRouter.brs | grep -q '"connect-four"'
          unzip -p "$ZIP" components/GameRouter.brs | grep -q '"color-clash"'
          unzip -p "$ZIP" components/GameRouter.brs | grep -q '"word-tiles"'
          unzip -p "$ZIP" components/GameRouter.brs | grep -q '"/color-clash"'
          unzip -p "$ZIP" components/MainScene.brs | grep -q 'tn-game-connect-four-server.onrender.com'
          ! unzip -p "$ZIP" components/MainScene.brs | grep -q '192\.168\.1\.127'

      - name: Upload permanent Roku artifact
        uses: actions/upload-artifact@v4
        with:
          name: tn-game-connect-four-dev
          path: experiences/roku/connect-four/dist/tn-game-connect-four-dev.zip
          if-no-files-found: error
          retention-days: 14
