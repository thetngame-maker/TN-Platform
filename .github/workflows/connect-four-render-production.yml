name: Connect Four Render Production Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'experiences/roku/connect-four/**'
      - '.github/workflows/connect-four-render-production.yml'
  push:
    branches:
      - main
    paths:
      - 'experiences/roku/connect-four/**'
      - '.github/workflows/connect-four-render-production.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Roku package
        run: |
          chmod +x experiences/roku/connect-four/build.sh
          chmod +x experiences/roku/connect-four/build-render-production.sh
          experiences/roku/connect-four/build-render-production.sh

      - name: Verify package
        run: |
          ZIP='experiences/roku/connect-four/dist/tn-game-connect-four-render-production.zip'
          test -f "$ZIP"
          unzip -Z1 "$ZIP" | grep -qx manifest
          ! unzip -p "$ZIP" components/MainScene.brs | grep -q '192\.168\.1\.127'
          unzip -p "$ZIP" components/MainScene.brs | grep -q 'tn-game-connect-four-server.onrender.com'

      - name: Upload Roku artifact
        uses: actions/upload-artifact@v4
        with:
          name: tn-game-connect-four-render-production
          path: experiences/roku/connect-four/dist/tn-game-connect-four-render-production.zip
          if-no-files-found: error
