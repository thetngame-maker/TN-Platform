name: Connect Four v1.4 Session Controls

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'experiences/roku/connect-four/**'
      - '.github/workflows/connect-four-v1.4-session-controls.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Roku package
        run: |
          chmod +x experiences/roku/connect-four/build.sh
          chmod +x experiences/roku/connect-four/build-thin-client-v1.sh
          chmod +x experiences/roku/connect-four/build-render-production.sh
          chmod +x experiences/roku/connect-four/build-complete-loop-v1.1.sh
          chmod +x experiences/roku/connect-four/build-two-player-v1.2.sh
          chmod +x experiences/roku/connect-four/build-gameplay-polish-v1.3.sh
          chmod +x experiences/roku/connect-four/build-session-controls-v1.4.sh
          experiences/roku/connect-four/build-session-controls-v1.4.sh

      - name: Verify preserved settings
        run: |
          ZIP='experiences/roku/connect-four/dist/tn-game-connect-four-v1.4.1-menu-fix.zip'
          test -f "$ZIP"
          unzip -Z1 "$ZIP" | grep -qx manifest
          unzip -Z1 "$ZIP" | grep -qx components/DisplayLoopTask.brs
          unzip -p "$ZIP" components/MainScene.brs | grep -q 'v1.4.1 MENU FIX'
          unzip -p "$ZIP" components/MainScene.brs | grep -q 'm.ignoreTvState = true'
          unzip -p "$ZIP" components/MainScene.brs | grep -q 'if m.ignoreTvState = true then return'
          unzip -p "$ZIP" components/MainScene.brs | grep -q 'BACK: change mode'
          unzip -p "$ZIP" components/MainScene.brs | grep -q 'DRAW GAME'
          unzip -p "$ZIP" components/MainScene.brs | grep -q 'TWO PLAYER MATCH'
          unzip -p "$ZIP" components/MainScene.brs | grep -q 'applyWinningHighlight'
          unzip -p "$ZIP" components/MainScene.brs | grep -q 'tn-game-connect-four-server.onrender.com'
          ! unzip -p "$ZIP" components/MainScene.brs | grep -q '192\.168\.1\.127'

      - name: Upload Roku artifact
        uses: actions/upload-artifact@v4
        with:
          name: tn-game-connect-four-v1.4.1-menu-fix
          path: experiences/roku/connect-four/dist/tn-game-connect-four-v1.4.1-menu-fix.zip
          if-no-files-found: error
