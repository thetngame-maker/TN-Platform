name: TN Platform CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'sprint-**'
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: tn-platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-package:
    name: Checks, tests, and release packaging
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify runtime versions
        run: |
          node --version
          npm --version
          php --version
          composer --version

      - name: Run syntax and architecture checks
        run: npm run check

      - name: Run automated tests
        run: npm test

      - name: Build release packages
        run: npm run build

      - name: Verify generated release artifacts
        run: |
          test -f dist/tn-game-os-v5.3.1-entity-explorer.zip
          test -f dist/tn-platform-core-api-v3.2.0-entity-engine.zip
          unzip -t dist/tn-game-os-v5.3.1-entity-explorer.zip
          unzip -t dist/tn-platform-core-api-v3.2.0-entity-engine.zip

      - name: Upload WordPress release
        uses: actions/upload-artifact@v4
        with:
          name: tn-game-os-v5.3.1-entity-explorer
          path: dist/tn-game-os-v5.3.1-entity-explorer.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload Platform Core API release
        uses: actions/upload-artifact@v4
        with:
          name: tn-platform-core-api-v3.2.0-entity-engine
          path: dist/tn-platform-core-api-v3.2.0-entity-engine.zip
          if-no-files-found: error
          retention-days: 14
