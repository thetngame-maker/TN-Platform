name: Connect Four v1.1 Complete Loop

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'experiences/roku/connect-four/**'
      - '.github/workflows/connect-four-v1.1-complete-loop.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Roku package
        run: |
          chmod +x experiences/roku/connect-four/build.sh
          chmod +x experiences/roku/connect-four/build-thin-client-v1.sh
          chmod +x experiences/roku/connect-four/build-render-production.sh
          chmod +x experiences/roku/connect-four/build-complete-loop-v1.1.sh
          experiences/roku/connect-four/build-complete-loop-v1.1.sh

      - name: Verify preserved production settings
        run: |
          ZIP='experiences/roku/connect-four/dist/tn-game-connect-four-v1.1.0-complete-loop.zip'
          test -f "$ZIP"
          unzip -Z1 "$ZIP" | grep -qx manifest
          unzip -Z1 "$ZIP" | grep -qx components/DisplayLoopTask.brs
          unzip -p "$ZIP" components/MainScene.brs | grep -q 'v1.1 LOOP'
          unzip -p "$ZIP" components/MainScene.brs | grep -q 'applyWinningHighlight'
          unzip -p "$ZIP" components/MainScene.brs | grep -q 'tn-game-connect-four-server.onrender.com'
          ! unzip -p "$ZIP" components/MainScene.brs | grep -q '192\.168\.1\.127'

      - name: Upload Roku artifact
        uses: actions/upload-artifact@v4
        with:
          name: tn-game-connect-four-v1.1.0-complete-loop
          path: experiences/roku/connect-four/dist/tn-game-connect-four-v1.1.0-complete-loop.zip
          if-no-files-found: error
